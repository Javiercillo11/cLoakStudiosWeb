name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin actividad.
# Este workflow hace una consulta ligera cada 3 días para que no llegue a pausarse.
# Usa las mismas variables del repositorio que el deploy (la anon key es pública por diseño).

on:
  schedule:
    - cron: '17 6 */3 * *' # cada 3 días, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta a Supabase
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Faltan las variables PUBLIC_SUPABASE_URL o PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi
          # Origen sin barra final ni /rest/v1/ (igual que en src/lib/contact/submit.ts).
          origin=$(echo "$SUPABASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')

          # Las claves anon antiguas (JWT) van también en Authorization; las nuevas solo en apikey.
          auth=()
          case "$SUPABASE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_KEY") ;; esac

          # Lectura de `leads`: RLS devuelve [] para anon, pero la consulta llega a la base de datos.
          status=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 \
            -H "apikey: $SUPABASE_KEY" "${auth[@]}" \
            "$origin/rest/v1/leads?select=*&limit=1")
          echo "HTTP $status"
          head -c 300 /tmp/body; echo

          # Cualquier respuesta < 500 significa que la base de datos está activa y respondió.
          # Un 5xx (p. ej. 540 = proyecto pausado) hace fallar el job y GitHub avisa por email.
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
            echo "::error::Supabase no responde (HTTP $status). Puede que el proyecto esté pausado: restáuralo desde el dashboard."
            exit 1
          fi
